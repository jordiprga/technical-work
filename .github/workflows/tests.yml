name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ui,dev]'
      - name: Run test suite
        run: python -m pytest -q
      - name: Exercise installed CLI
        run: entropy-oracle --source nonlinear --models marginal,markov5 --n 500 --bootstrap 0 --output /tmp/entropy-oracle-smoke
