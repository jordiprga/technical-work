[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-oracle"
version = "0.2.0"
description = "Adversarial discrete-source prediction research benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "psutil>=5.9",
    "threadpoolctl>=3.2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "plotly>=5.20", "pandas>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
entropy-oracle = "entropy_oracle.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["entropy_oracle*"]
exclude = ["tests*", "results*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
