[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptosure-prototype"
version = "0.1.0"
description = "Offline evidence and traceability demonstrator; not a certification tool"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cryptosure = "cryptosure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
